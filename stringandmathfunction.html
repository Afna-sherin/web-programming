<html>
<head>
<title>JavaScript String and Math Objects</title>
<style>
body{
font-family: Arial, sans-serif;

}
h1{
color:black;
}

input{

<body><center>
<h1><u>STRING AND MATH OBJECT FUNCTIONS</u></h1></center>
<h2>1.String Object Functions</h2>
Enter a String:
<input type="text" id="str">
<br>
<button onclick="stringFunctions()">Submit</button>
<p id="stringResult"></p>
<script>
function stringFunctions()
{
var str=document.getElementById("str").value;
var result="<b>Original String=</b>"+str+"<br><br>";
result +="1.Length:"+str.length+"<br>";
result +="2.Uppercase:"+str.toUpperCase()+"<br>";
result +="3.Lowercase:"+str.toLowerCase()+"<br>";
result +="4.Character at position 1:"+ str.charAt(1)+"<br>";
result +="5.Index of letter j:"+str.indexOf("j")+"<br>";
result +="6.Slice[0,5]:"+str.slice(0,5)+"<br>";
result +="7.Replace:"+str.replace(str.slice(0,4),"welcome")+"<br>";
result += "8.Concatenation:"+str.concat(" Programming")+"<br>";
result += "9.Trim:"+(" " + str + " ").trim()+"<br>";
document.getElementById("stringResult").innerHTML=result;
}
</script>
<hr>
<h2>2.Math Object Functions</h2>
Enter a Number:
<input type="number" id="num" step="any"><br><br>
Enter First Number: <input type="number" id="n1"><br><br>
Enter Second Number: <input type="number" id="n2"><br><br>
Enter Third Number: <input type="number" id="n3"><br><br>
<button onclick="mathFunctions()">submit</button>
<div id="mathResult"></div>
<script>
function mathFunctions()
{
var num=Number(document.getElementById("num").value);
var a = Number(document.getElementById("n1").value); 
var b = Number(document.getElementById("n2").value); 
var c = Number(document.getElementById("n3").value);
var result="<b>Original Number=</b>"+num+"<br><br>";
result +="1.Absolute Value:"+Math.abs(num)+"<br>";
result +="2.Round:"+Math.round(num)+"<br>";
result +="3.Ceil:"+Math.ceil(num)+"<br>";
result +="4.Floor:"+Math.floor(num)+"<br>";
result +="5.Square Root:"+Math.sqrt(num)+"<br>";
result += "6.Power to 3:"+Math.pow(num, 3)+"<br>";
result += "7.Maximum (a,b,c):"+Math.max(a,b,c)+"<br>";
result += "8.Minimum (a,b,c):"+Math.min(a,b,c)+"<br>";
result += "9.Random Number:"+Math.random()+"<br>";
result += "10.PI Value:"+Math.PI+"<br>";
document.getElementById("mathResult").innerHTML = result;
}
</script>
</body>
</html>
